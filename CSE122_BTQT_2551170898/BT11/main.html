<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11 — Thư viện ảnh (figure / figcaption)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Thư viện ảnh Việt Nam</h1>
        <p class="subtitle">Bộ sưu tập 6 danh thắng tiêu biểu — minh hoạ thẻ figure / figcaption.</p>
    </header>

    <main class="gallery-container">
        <figure class="gallery-item">
            <img src="Anh/Bai11/1.jpg" alt="Vịnh Hạ Long">
            <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Anh/Bai11/2.jpg" alt="Hang Sơn Đoòng">
            <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Anh/Bai11/3.jpg" alt="Thác Bản Giốc">
            <figcaption>Hình 3. Thác Bản Giốc</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Anh/Bai11/4.jpg" alt="Fansipan">
            <figcaption>Hình 4. Fansipan</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Anh/Bai11/5.jpg" alt="Đồng bằng sông Cửu Long">
            <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Anh/Bai11/6.jpg" alt="Động Phong Nha">
            <figcaption>Hình 6. Động Phong Nha</figcaption>
        </figure>
    </main>

</body>
</html>
