<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng danh sách món ăn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Tiêu đề: "Các món ngon Hà Nội" màu cam, căn giữa -->
        <h1 class="main-title">Các món ngon Hà Nội</h1>

        <!-- Bố cục gồm Ảnh minh họa bên trái, Bảng bên phải -->
        <div class="content-wrapper">
            <!-- Ảnh minh họa bên trái -->
            <div class="left-col">
                <img src="Anh/Bai06/Bat.gif" alt="Bát món ăn" class="food-img">
            </div>

            <!-- Bảng danh sách bên phải -->
            <div class="right-col">
                <table class="food-table">
                    <thead>
                        <tr>
                            <th class="col-stt">STT</th>
                            <th class="col-name">Tên món ăn</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="stt">1</td>
                            <td>Bánh cuốn Thanh Trì</td>
                        </tr>
                        <tr>
                            <td class="stt">2</td>
                            <td>Xôi Hà Nội</td>
                        </tr>
                        <tr>
                            <td class="stt">3</td>
                            <td>Chả cá Lã Vọng</td>
                        </tr>
                        <tr>
                            <td class="stt">4</td>
                            <td>Cháo Cóc</td>
                        </tr>
                        <tr>
                            <td class="stt">5</td>
                            <td>Bánh Gai Ninh Giang</td>
                        </tr>
                        <tr>
                            <td class="stt">6</td>
                            <td>Bún Thang Hà Nội</td>
                        </tr>
                        <tr>
                            <td class="stt">7</td>
                            <td>Canh Lắng</td>
                        </tr>
                        <tr>
                            <td class="stt">8</td>
                            <td>Vịt quay Lạng Sơn</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
